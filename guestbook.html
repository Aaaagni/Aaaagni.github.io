<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GUESTBOOK // 留言板・メッセージボード</title>
<style>
  :root{
    --pink:#ffb6c1; --pink-deep:#ff8fab; --pink-dark:#f78fb3;
    --mint:#b7e8d8; --mint-deep:#a8e6cf;
    --cream:#fffaf5; --ink:#4a4a4a; --skin:#ffe9d6;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ scroll-behavior:smooth; }
  body{
    font-family:"Courier New", "MS Gothic", "Microsoft YaHei", monospace;
    background-color:var(--cream);
    background-image:
      radial-gradient(var(--pink) 1px, transparent 1px),
      radial-gradient(var(--mint) 1px, transparent 1px);
    background-size:22px 22px, 22px 22px;
    background-position:0 0, 11px 11px;
    color:var(--ink);
    line-height:1.6;
    padding-bottom:60px;
    image-rendering:pixelated;
  }

  /* ---------- 顶部条纹（与主页一致） ---------- */
  .stripes{
    height:16px;
    border-bottom:3px solid var(--ink);
    background:repeating-linear-gradient(90deg,
      var(--pink) 0 18px, var(--mint) 18px 36px,
      var(--cream) 36px 42px, var(--pink) 42px 60px);
    animation:stripeMove 12s linear infinite;
  }
  @keyframes stripeMove{ from{background-position:0 0;} to{background-position:60px 0;} }

  /* ---------- 导航 ---------- */
  nav{
    background:var(--cream);
    border-bottom:3px solid var(--ink);
    display:flex; align-items:center; gap:4px;
    padding:8px 14px;
    position:sticky; top:0; z-index:50;
    box-shadow:0 4px 0 rgba(74,74,74,.15);
  }
  nav .logo{
    font-weight:900; letter-spacing:1px;
    background:var(--ink); color:var(--cream);
    padding:4px 10px; border:2px solid var(--ink);
    box-shadow:3px 3px 0 var(--pink);
    white-space:nowrap;
  }
  nav .link{
    text-decoration:none; color:var(--ink);
    border:2px solid var(--ink); background:var(--mint);
    padding:4px 12px; font-weight:700;
    box-shadow:3px 3px 0 var(--ink);
    transition:transform .05s;
  }
  nav .link:active{ transform:translate(3px,3px); box-shadow:none; }
  nav .link:hover{ background:#d6f3e8; }
  nav .hint{ margin-left:auto; font-size:11px; }

  /* ---------- 页头 ---------- */
  .page-head{ text-align:center; margin:26px 12px 14px; }
  .page-title{
    display:inline-block;
    font-size:24px; font-weight:900; letter-spacing:3px;
    background:var(--ink); color:var(--cream);
    padding:8px 22px; border:3px solid var(--ink);
    box-shadow:6px 6px 0 var(--pink);
    transform:rotate(-1deg);
  }
  .page-title .ja{ color:var(--pink); font-size:14px; letter-spacing:6px; }
  .page-sub{ margin-top:14px; font-size:12px; color:#666; }

  /* ---------- 计数徽章 ---------- */
  .count-badge{
    display:inline-block; margin-top:12px;
    background:var(--ink); color:var(--cream);
    border:2px solid var(--ink);
    padding:4px 16px; font-weight:700; letter-spacing:2px;
    box-shadow:4px 4px 0 var(--pink);
    font-size:13px;
  }
  .count-badge b{ color:var(--pink); font-size:18px; margin:0 3px; }

  /* ---------- 毛毡板 ---------- */
  .board-wrap{ max-width:1060px; margin:0 auto; padding:0 12px; text-align:center; }
  .board{
    position:relative;
    margin:20px auto 0;
    padding:34px 20px 20px;
    min-height:420px;
    isolation:isolate;    /* 便签层级只在板内生效，不盖住导航/表单等板外元素 */
    background-color:#d9808f;                       /* 毛毡主色：柔粉 */
    background-image:
      radial-gradient(rgba(255,255,255,.08) 1px, transparent 1px),
      radial-gradient(rgba(74,74,74,.06) 1px, transparent 1px),
      repeating-linear-gradient(45deg, rgba(74,74,74,.035) 0 2px, transparent 2px 4px),
      repeating-linear-gradient(-45deg, rgba(255,255,255,.05) 0 2px, transparent 2px 4px);
    background-size:7px 7px, 7px 7px, auto, auto;
    border:3px solid var(--ink);
    box-shadow:inset 0 0 0 4px var(--cream), inset 0 0 0 7px var(--ink), 6px 6px 0 rgba(74,74,74,.9);
    display:block;   /* 堆叠布局：便签绝对定位，新的盖在旧的上面 */
  }
  /* 毛毡板顶部挂牌（胶带贴纸） */
  .board .plate{
    position:absolute; top:-16px; left:50%;
    transform:translateX(-50%) rotate(-2deg);
    background:var(--cream);
    border:2px solid var(--ink);
    padding:3px 16px; font-size:12px; font-weight:900;
    letter-spacing:3px;
    box-shadow:3px 3px 0 rgba(74,74,74,.5);
    white-space:nowrap; z-index:5;   /* 挂牌是板面装饰，便签贴纸可以自然盖住它 */
  }
  .board .plate::before, .board .plate::after{
    content:""; position:absolute; top:-5px; width:34px; height:14px;
    background:rgba(255,240,180,.9); border:1px solid rgba(74,74,74,.35);
    transform:rotate(-8deg);
  }
  .board .plate::before{ left:8px; }
  .board .plate::after{ right:8px; transform:rotate(8deg); }
  .board.empty::after{
    content:"ここはまだ空っぽ… 快贴上第一张便签吧 (´｡• ω •｡`)";
    position:absolute; inset:auto 20px 26px;
    color:rgba(74,74,74,.55); font-size:12px; letter-spacing:2px;
  }

  /* ---------- 便签 ---------- */
  .note-card{
    position:absolute;
    left:var(--x,2%); top:var(--y,4%);
    width:168px; min-height:148px;
    padding:26px 12px 12px;
    font-size:12px; text-align:left;
    border:2px solid var(--ink);
    box-shadow:4px 4px 0 rgba(74,74,74,.55);
    transform:rotate(var(--rot,0deg));
  }
  .note-card:hover{ transform:rotate(0deg) scale(1.07); }
  .note-card .tape{
    position:absolute; top:-11px; left:50%;
    width:74px; height:20px;
    margin-left:-37px;
    background:rgba(255,240,180,.92);
    border:1px solid rgba(74,74,74,.4);
    box-shadow:1px 2px 0 rgba(74,74,74,.25);
    transform:rotate(-3deg);
    z-index:2;
  }
  .note-card .tape::after{
    content:""; position:absolute; left:4px; right:4px; top:9px;
    height:1px; background:rgba(74,74,74,.15);
  }
  .note-card .who{
    font-weight:900; letter-spacing:1px; font-size:11px;
    margin-bottom:6px; word-break:break-all;
  }
  .note-card .who::before{ content:"♪ "; color:var(--pink-deep); }
  .note-card .body{ white-space:pre-wrap; word-break:break-word; }
  .note-card .time{
    margin-top:8px; font-size:9px; color:#888; text-align:right;
  }
  .note-card .pin{
    position:absolute; top:4px; left:50%; margin-left:-5px;
    width:10px; height:10px; border-radius:50%;
    background:#ff5252;
    box-shadow:inset -2px -2px 0 rgba(0,0,0,.25), inset 2px 2px 0 rgba(255,255,255,.45);
    z-index:3;
  }
  /* 便签底色 */
  .c-yellow{ background:#fff3a6; }
  .c-pink{ background:#ffd3e0; }
  .c-mint{ background:#c9f0e0; }
  .c-white{ background:#fffaf5; }

  /* 新便签“啪”地贴上去 */
  @keyframes stick{
    0%{ transform:scale(.6) rotate(var(--rot,-2deg)); opacity:0; }
    55%{ transform:scale(1.08) rotate(var(--rot,-2deg)); opacity:1; }
    75%{ transform:scale(.97) rotate(var(--rot,-2deg)); }
    100%{ transform:scale(1) rotate(var(--rot,-2deg)); }
  }
  .note-card.stick{ animation:stick .3s steps(4) both; }

  /* ---------- 留言表单 ---------- */
  .form-card{
    max-width:560px; margin:26px auto 0;
    background:var(--cream);
    border:3px solid var(--ink);
    box-shadow:6px 6px 0 var(--pink);
    padding:16px;
    position:relative;
  }
  .form-card::before{
    content:"✦"; position:absolute; top:-12px; right:10px;
    background:var(--cream); padding:0 6px;
    border:2px solid var(--ink); color:var(--pink-deep);
  }
  .form-card h2{
    display:inline-block; font-size:14px; letter-spacing:2px;
    background:var(--ink); color:var(--cream);
    padding:3px 10px; margin-bottom:12px;
  }
  .form-card h2 .ja{ color:var(--pink); font-size:11px; letter-spacing:4px; }
  .form-card label{ font-size:11px; font-weight:700; display:block; margin:8px 0 3px; letter-spacing:1px; }
  .form-card input, .form-card textarea{
    width:100%; font-family:inherit; font-size:13px;
    border:2px solid var(--ink); background:#fff; padding:8px;
    outline:none; resize:vertical;
  }
  .form-card input:focus, .form-card textarea:focus{ box-shadow:0 0 0 3px var(--pink); }
  .form-card textarea{ min-height:90px; }
  .form-card .row{ display:flex; gap:10px; }
  .form-card .row > div{ flex:1; }
  .form-card .postbtn{
    width:100%; margin-top:12px;
    font-family:inherit; font-size:14px; font-weight:900; letter-spacing:2px;
    background:var(--pink); color:var(--ink);
    border:3px solid var(--ink); padding:10px 0; cursor:pointer;
    box-shadow:4px 4px 0 var(--ink);
  }
  .form-card .postbtn:hover{ background:var(--pink-deep); }
  .form-card .postbtn:active{ transform:translate(4px,4px); box-shadow:none; }
  .form-card .hint-note{
    font-size:10px; color:#999; text-align:center; margin-top:8px;
  }

  /* ---------- 提示条 ---------- */
  .toast{
    position:fixed; left:50%; bottom:24px;
    transform:translateX(-50%);
    background:var(--ink); color:var(--cream);
    border:2px solid var(--ink); box-shadow:4px 4px 0 var(--pink);
    padding:8px 16px; font-size:12px; font-weight:700; letter-spacing:1px;
    z-index:99; display:none; white-space:nowrap;
  }

  /* ---------- 页脚 ---------- */
  footer{ text-align:center; font-size:11px; color:#888; margin-top:30px; }
  footer .backbtn{
    display:inline-block; margin-bottom:10px;
    font-family:inherit; font-weight:900; font-size:13px;
    text-decoration:none; color:var(--ink);
    background:var(--mint); border:3px solid var(--ink);
    box-shadow:4px 4px 0 var(--pink);
    padding:8px 18px;
  }
  footer .backbtn:active{ transform:translate(4px,4px); box-shadow:none; }

  /* ---------- 响应式 ---------- */
  @media (max-width:480px){
    nav .hint{ display:none; }
    .form-card .row{ flex-direction:column; gap:0; }
    .note-card{ width:150px; }
  }
</style>
</head>
<body>

<!-- 顶部粉绿条纹 -->
<div class="stripes"></div>

<!-- 导航 -->
<nav>
  <span class="logo">WU_JIAXU.com</span>
  <a class="link" href="index.html">◀ HOME</a>
  <span class="hint">(´｡• ω •｡`) 毛毡板欢迎你</span>
</nav>

<!-- 页头 -->
<header class="page-head">
  <h1 class="page-title">GUESTBOOK<span class="ja">メッセージボード</span></h1>
  <p class="page-sub">毛毡板上贴满了大家的便签 ✦ 你也来贴一张吧 ( ˘ω˘ )</p>
  <div class="count-badge">便簽數：<b id="count">0</b> 枚</div>
</header>

<!-- 毛毡板 -->
<div class="board-wrap">
  <div class="board" id="board">
    <span class="plate">✿ WU_TAPE 留言牆 ✿</span>
    <!-- 便签由 JS 渲染到此处 -->
  </div>
</div>

<!-- 留言表单 -->
<section class="form-card">
  <h2>新しい便签<span class="ja">留言</span></h2>
  <div class="row">
    <div>
      <label>お名前 / 你的名字</label>
      <input id="name" type="text" maxlength="20" placeholder="如：路过的候鸟">
    </div>
  </div>
  <label>メッセージ / 留言内容</label>
  <textarea id="text" maxlength="200" placeholder="写点什么…(´｡• ω •｡`)\n例如：天台的麻雀今天也在发呆！"></textarea>
  <button class="postbtn" id="postBtn">📌 貼る!! 贴上便签</button>
  <div class="hint-note">※ 通过 server.py 运行时，便签会写入服务器文件 guestbook-data.json；若直接双击打开文件（无服务器），则仅保存在本机浏览器</div>
</section>

<footer>
  <a class="backbtn" href="index.html">◀ 返回 WU_JIAXU.com</a>
  <div>© 2026 WU JIAXU ・ 毛毡板由 HTML + 一点点胶带构成</div>
  <div>(´｡• ω •｡`) ・ (ﾉ´ヮ`)ﾉ*: ･ﾟ ・ ( ˘ω˘ )</div>
</footer>

<script>
/* ================= 便签数据：优先服务器文件，降级 localStorage ================= */
var STORAGE_KEY = 'wjx_guestbook_v1';
var COLORS = ['c-yellow', 'c-pink', 'c-mint', 'c-white'];
var notes = [];
var serverMode = true;   // 服务器可用时为 true
boot();

function loadLocal(){
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  }catch(e){ /* file:// 等受限环境则使用内存 */ }
  return [];
}
function saveLocal(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
  }catch(e){ /* 忽略 */ }
}
function boot(){
  fetch('/api/notes', {cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error('api'); return r.json(); })
    .then(function(d){
      serverMode = true;
      notes = (d && d.notes) || [];
      render();
    })
    .catch(function(){
      serverMode = false;
      notes = loadLocal();
      render();
    });
}

/* ================= 渲染毛毡板（新便签叠在旧便签上面） ================= */
function hashStr(s){
  var h = 5381;
  for (var i = 0; i < s.length; i++){ h = ((h << 5) + h + s.charCodeAt(i)) >>> 0; }
  return h;
}
/* 同一张便签每次刷新位置稳定（由 id 派生），叠放更自然 */
function posFor(id){
  var h = hashStr(String(id));
  var x = 2 + (h % 1000) / 1000 * 78;            // 2% ~ 80%，铺满整块板
  var y = 4 + ((h >>> 10) % 1000) / 1000 * 50;   // 4% ~ 54%
  return {x: x.toFixed(1), y: y.toFixed(1)};
}
function render(){
  var board = document.getElementById('board');
  board.classList.toggle('empty', notes.length === 0);
  /* 保留挂牌，清除便签 */
  var plate = board.querySelector('.plate');
  board.querySelectorAll('.note-card').forEach(function(n){ n.remove(); });
  if (plate) board.appendChild(plate);
  notes.forEach(function(n, i){
    board.insertBefore(makeNote(n, i, i === 0), plate);
  });
  /* 板高度随便签数量增长，给随机分布留空间 */
  board.style.minHeight = Math.max(500, 160 + notes.length * 85) + 'px';
  document.getElementById('count').textContent = notes.length;
}

function makeNote(n, i, isNew){
  var card = document.createElement('div');
  card.className = 'note-card ' + (n.color || 'c-yellow');
  var p = posFor(n.id || (i + '-' + Math.random()));
  card.style.setProperty('--x', p.x + '%');
  card.style.setProperty('--y', p.y + '%');
  card.style.setProperty('--rot', (n.rot || '0') + 'deg');
  card.style.zIndex = 100 + (notes.length - i);   /* 越新越靠上 */
  card.innerHTML =
    '<span class="tape"></span>' +
    '<span class="pin"></span>' +
    '<div class="who">' + esc(n.name) + '</div>' +
    '<div class="body">' + esc(n.text) + '</div>' +
    '<div class="time">' + esc(n.time) + '</div>';
  if (isNew) card.classList.add('stick');
  return card;
}

function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ================= 提交留言 ================= */
function post(){
  var nameEl = document.getElementById('name');
  var textEl = document.getElementById('text');
  var name = nameEl.value.trim();
  var text = textEl.value.trim();
  if (!name){ nameEl.focus(); nameEl.style.boxShadow = '0 0 0 3px #ff5252'; setTimeout(function(){ nameEl.style.boxShadow=''; }, 900); return; }
  if (!text){ textEl.focus(); textEl.style.boxShadow = '0 0 0 3px #ff5252'; setTimeout(function(){ textEl.style.boxShadow=''; }, 900); return; }

  var now = new Date();
  var pad = function(n){ return n < 10 ? '0' + n : n; };
  var note = {
    name: name,
    text: text,
    time: (now.getMonth()+1) + '/' + pad(now.getDate()) + ' ' + pad(now.getHours()) + ':' + pad(now.getMinutes()),
    color: COLORS[Math.floor(Math.random()*COLORS.length)],
    rot: (Math.random()*6 - 3).toFixed(1)
  };

  if (serverMode){
    /* 服务器模式：POST 写入 guestbook-data.json */
    fetch('/api/notes', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({name: name, text: text})
    })
    .then(function(r){ if(!r.ok) throw new Error('api'); return r.json(); })
    .then(function(d){
      notes = (d && d.notes) || notes;
      render();
      nameEl.value = ''; textEl.value = '';
      pluck();
      toast('便签已钉上毛毡板 ✦ 已写入 guestbook-data.json');
    })
    .catch(function(){ fallbackLocal(nameEl, textEl, note); });
  } else {
    /* 离线降级：仅存本机浏览器 */
    fallbackLocal(nameEl, textEl, note);
  }
}

function fallbackLocal(nameEl, textEl, note){
  notes.unshift(note);   // 新便签贴在最前面
  saveLocal();
  render();              // 便签数随之 +1
  nameEl.value = ''; textEl.value = '';
  pluck();               // 图钉音效
  toast('⚠ 服务器未运行，便签仅保存在本机浏览器');
}

function toast(msg){
  var t = document.getElementById('toast');
  if (!t){
    t = document.createElement('div');
    t.id = 'toast'; t.className = 'toast';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(t._timer);
  t._timer = setTimeout(function(){ t.style.display = 'none'; }, 2600);
}

document.getElementById('postBtn').addEventListener('click', post);
document.getElementById('text').addEventListener('keydown', function(e){
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) post();
});

/* ================= 8-bit 图钉音效（Web Audio 合成） ================= */
var ac = null;
function pluck(){
  try{
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!ac) ac = new AC();
    if (ac.state === 'suspended') ac.resume();
    var t = ac.currentTime;
    [1200, 880].forEach(function(f, i){
      var o = ac.createOscillator(), g = ac.createGain();
      o.type = 'square'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t + i*0.05);
      g.gain.linearRampToValueAtTime(0.06, t + i*0.05 + 0.01);
      g.gain.linearRampToValueAtTime(0.0001, t + i*0.05 + 0.12);
      o.connect(g); g.connect(ac.destination);
      o.start(t + i*0.05); o.stop(t + i*0.05 + 0.15);
    });
  }catch(e){}
}
</script>
</body>
</html>
